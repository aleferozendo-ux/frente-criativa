# Configuração do Render — site estático da Frente Criativa
# O Render lê este arquivo e publica o site automaticamente.
services:
  - type: web
    name: frente-criativa
    runtime: static
    buildCommand: ""          # site estático, não precisa build
    staticPublishPath: .      # publica a pasta inteira (index.html na raiz)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
